name: Keepalive

# Optional. Always-on VPS does not need this. Set repo variable
# KEEPALIVE_GATEWAY_URL (e.g. http://YOUR_VM_IP:8080) to enable.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.KEEPALIVE_GATEWAY_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ping gateway health
        env:
          KEEPALIVE_INTERVAL_MS: "45000"
          KEEPALIVE_DURATION_MS: "50000"
          KEEPALIVE_GATEWAY_URL: ${{ vars.KEEPALIVE_GATEWAY_URL }}
          KEEPALIVE_FRONTEND_URL: ${{ vars.KEEPALIVE_FRONTEND_URL }}
        run: node scripts/keepalive.js
