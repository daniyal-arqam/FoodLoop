# Copy to secrets.yaml and replace placeholders. Do not commit real secrets.
#   cp infrastructure/kubernetes/secrets.example.yaml infrastructure/kubernetes/secrets.yaml
# kubectl apply -f infrastructure/kubernetes/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: foodloop-secrets
  namespace: foodloop
  labels:
    app.kubernetes.io/part-of: foodloop
    app.kubernetes.io/name: foodloop-secrets
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-strong-jwt-secret"
  OPENAI_API_KEY: ""
