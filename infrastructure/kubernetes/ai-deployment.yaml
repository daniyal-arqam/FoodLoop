apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: foodloop
  labels:
    app: ai-service
    app.kubernetes.io/part-of: foodloop
    app.kubernetes.io/name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        app.kubernetes.io/part-of: foodloop
    spec:
      containers:
        - name: ai-service
          image: foodloop-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: SERVICE_NAME
              value: ai-service
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: foodloop-config
                  key: CORS_ORIGINS
            - name: FOOD_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: foodloop-config
                  key: FOOD_SERVICE_URL
            - name: ORGANIZATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: foodloop-config
                  key: ORGANIZATION_SERVICE_URL
            - name: MATCHER_URL
              valueFrom:
                configMapKeyRef:
                  name: foodloop-config
                  key: MATCHER_URL
            - name: OPENAI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: foodloop-config
                  key: OPENAI_BASE_URL
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: foodloop-config
                  key: OPENAI_MODEL
            - name: AI_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: foodloop-config
                  key: AI_TIMEOUT_SECONDS
            - name: FOODLOOP_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: foodloop-config
                  key: FOODLOOP_TIMEOUT_SECONDS
            - name: AGENT_MAX_STEPS
              valueFrom:
                configMapKeyRef:
                  name: foodloop-config
                  key: AGENT_MAX_STEPS
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: foodloop-secrets
                  key: OPENAI_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
